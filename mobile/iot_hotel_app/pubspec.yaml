name: iot_hotel_app
description: "智联酒店 - 智慧酒店物联网控制系统跨平台App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  dio: ^5.7.0
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  mqtt_client: ^10.3.0
  web_socket_channel: ^3.0.2
  json_annotation: ^4.9.0
  fl_chart: ^0.70.2
  intl: ^0.19.0
  flutter_svg: ^2.0.16
  shared_preferences: ^2.5.2
  flutter_spinkit: ^5.2.1
  google_fonts: ^6.2.1
  flutter_webrtc: ^0.12.3
  socket_io_client: ^3.0.2
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.9.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
