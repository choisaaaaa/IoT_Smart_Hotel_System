# Redis配置文件 - 智慧酒店物联网控制系统

# 绑定地址 (允许所有网络接口访问)
bind 0.0.0.0

# 保护模式 (开发环境关闭，生产环境开启)
protected-mode no

# 端口
port 6379

# 后台运行 (Docker中不需要)
daemonize no

# 日志级别
loglevel notice

# 日志文件 (标准输出)
logfile ""

# 数据库数量
databases 16

# 持久化配置
# RDB快照配置
save 900 1
save 300 10
save 60 10000

# RDB文件名
dbfilename dump.rdb

# RDB文件保存目录
dir /data

# AOF持久化配置
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# 内存管理
# 最大内存限制 (根据服务器配置调整)
# maxmemory 256mb

# 内存淘汰策略
maxmemory-policy allkeys-lru

# 客户端连接
# 最大客户端连接数
maxclients 10000

# TCP连接超时时间 (秒)
timeout 0
tcp-keepalive 300

# 性能优化
# 禁用THP (透明大页)
# 需要在宿主机上执行: echo never > /sys/kernel/mm/transparent_hugepage/enabled

# 慢查询日志
slowlog-log-slower-than 10000
slowlog-max-len 128

# 键过期事件通知 (用于缓存失效通知)
notify-keyspace-events Ex

# 安全设置 (生产环境建议开启)
# requirepass your_redis_password

# 禁用危险命令 (生产环境建议开启)
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""
# rename-command DEBUG ""
