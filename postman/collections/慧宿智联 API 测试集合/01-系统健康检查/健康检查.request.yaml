$kind: http-request
url: "{{baseUrl}}/health"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('服务健康', function () {
          pm.response.to.have.status(200);
          var jsonData = pm.response.json();
          pm.expect(jsonData.status).to.eql('healthy');
      });
    language: text/javascript
order: 2000
