$kind: http-request
url: "{{baseUrl}}/api/v1/ai-butler/chat"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{guestToken}}
body:
  type: text
  content: |-
    {
        "message": "WiFi密码是多少"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('AI回复成功', function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData.code).to.eql(200);
          pm.expect(jsonData.data.reply).to.exist;
      });

      pm.test('AI回复包含WiFi信息', function () {
          var jsonData = pm.response.json();
          var reply = jsonData.data.reply.toLowerCase();
          pm.expect(reply).to.contain.oneOf(['wifi', '密码', '网络']);
      });
    language: text/javascript
order: 1000
