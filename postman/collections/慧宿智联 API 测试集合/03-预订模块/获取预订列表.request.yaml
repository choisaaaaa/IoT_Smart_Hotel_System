$kind: http-request
url: "{{baseUrl}}/api/v1/bookings?page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{adminToken}}
queryParams:
  page: "1"
  limit: "10"
scripts:
  - type: afterResponse
    code: |-
      pm.test('获取预订列表成功', function () {
          pm.response.to.have.status(200);
          var jsonData = pm.response.json();
          pm.expect(jsonData.code).to.eql(200);
          pm.expect(jsonData.data.list).to.be.an('array');
          pm.expect(jsonData.data.total).to.exist;
      });
    language: text/javascript
order: 2000
